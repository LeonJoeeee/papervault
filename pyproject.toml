[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papervault"
version = "0.1.0"
description = "Self-hosted literature + knowledge layer for coding agents — one MCP server: discover papers, read full text, query a graph-RAG knowledge base with cited answers."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "papervault contributors" }]
keywords = ["mcp", "rag", "research", "papers", "knowledge-graph", "lightrag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # --- shared ---
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "requests>=2.31",
    "click>=8.1",
    "filelock>=3.13",
    "mcp>=1.27.1",
    # --- knowledge (graph-RAG) ---
    "lightrag-hku>=1.4",       # framework spine; extraction prompt monkeypatch is version-sensitive
    "openai>=1.50",            # raw OpenAI-compatible SDK (knowledge LLM path)
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.3.1",
    "pgvector>=0.3",
    "neo4j>=6.2.0",
    "sentence-transformers>=3.0",  # BGE-M3 embed + reranker (local GPU)
    "FlagEmbedding>=1.3",
    "torch>=2.4",
    # --- library (literature acquisition) ---
    "litellm>=1.70",           # OpenAI-compatible SDK (library LLM path: judge / resolver / intent)
    "pypdf>=4.0",
    "feedparser>=6.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Grey-zone download tiers (ADR-0004): shadow libraries + anti-bot scraping.
# NOT installed by default — the download cascade skips these tiers cleanly when
# the imports are absent (_safe_call converts ImportError to a miss). Enabling
# them (install + the tier env flags) is the operator's own legal decision.
grey = [
    "cloudscraper>=1.2",
    "curl-cffi>=0.7",
    "scrapling>=0.2",
    "firecrawl-py>=1.0",
]
# PDF -> markdown via a local MinerU2.5-Pro vLLM server (heavy GPU dep, own venv
# in practice). The http-client path needs only the mineru client libs.
mineru = ["mineru[core,vllm]>=3.2"]
# Zotero metadata sync (optional integration).
zotero = ["pyzotero>=1.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "responses>=0.25",
    "ruff>=0.6",
]

[project.scripts]
papervault = "papervault.cli:main"
papervault-mcp = "papervault.mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/papervault"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires GPU / Postgres / Neo4j / network / a live LLM (excluded from CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Start conservative: real errors, not style bikeshedding. The migrated corpus
# carries its own idioms; broaden this over time, not on day one.
select = ["E9", "F63", "F7", "F82", "F401", "F811"]
ignore = ["E501"]
