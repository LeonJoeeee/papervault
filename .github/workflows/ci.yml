name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff
        # --no-project / uvx: lint without syncing the heavy runtime tree (torch, lightrag, …).
        run: uvx ruff check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit plus its two parents, so the binding step can read them.
          fetch-depth: 2
      - name: Bind this checkout to the advertised PR merge result
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (CPU torch — CI has no GPU)
        env:
          # Pull the CPU-only torch build so CI stays lean and GPU-free.
          UV_TORCH_BACKEND: cpu
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          uv pip install pytest-timeout
      - name: Unit tests (no GPU / DB / network)
        run: |
          uv run pytest -m "not integration" -p no:cacheprovider \
            --timeout=60 --timeout-method=thread -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build sdist + wheel
        run: |
          uv build

  merged-result:
    name: merged-result / ${{ github.event.pull_request.base.sha }} / ${{ github.event.pull_request.head.sha }}
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "this exact merge of base and head passed the test job"
