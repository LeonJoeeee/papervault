[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papervault"
version = "0.1.0"
description = "Self-hosted literature + knowledge layer for coding agents — one MCP server: discover papers, read full text, query a graph-RAG knowledge base with cited answers."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "papervault contributors" }]
keywords = ["mcp", "rag", "research", "papers", "knowledge-graph", "lightrag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # --- shared ---
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "requests>=2.31",
    "click>=8.1",
    "filelock>=3.13",
    "mcp>=1.27.1",
    "uvicorn>=0.30",           # the streamable-http `papervault serve` path imports it directly
    # --- knowledge (graph-RAG) ---
    # Framework spine, ported to the 1.5.x line (2026-07-17 port map): ontology + exclusions
    # travel via addon_params['entity_types_guidance']; examples via PROMPTS (text mode);
    # one monkeypatch (kill the `Other` escape hatch) anchored on 1.5.x internals with a
    # fail-loud guard; PARSING/ANALYZING doc phases handled in the scheduler. The ceiling is
    # load-bearing: bump it only with a fresh port map + probe build + FAST recall gate.
    "lightrag-hku>=1.5,<1.6",
    "openai>=1.50",            # raw OpenAI-compatible SDK (knowledge LLM path)
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.3.1",
    "pgvector>=0.3",
    "neo4j>=6.2.0",
    "sentence-transformers>=3.0",  # BGE-M3 embed + reranker (local GPU)
    "FlagEmbedding>=1.3",
    "torch>=2.4",
    # --- library (literature acquisition) ---
    "litellm>=1.70",           # OpenAI-compatible SDK (library LLM path: judge / resolver / intent)
    "pypdf>=4.0",
    "feedparser>=6.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Grey-zone download tiers (ADR-0004): shadow libraries + anti-bot scraping.
# NOT installed by default — the download cascade skips these tiers cleanly when
# the imports are absent (_safe_call converts ImportError to a miss). Enabling
# them (install + the tier env flags) is the operator's own legal decision.
grey = [
    "cloudscraper>=1.2",
    "curl-cffi>=0.7",
    "scrapling>=0.2",
    "firecrawl-py>=1.0",
]
# PDF -> markdown OCR. The papervault service is an http-CLIENT of a MinerU vLLM server that
# runs in its OWN venv (.venv-mineru) — so THIS venv needs only mineru's client libs, NOT the
# heavy local `vllm` extra. Pulling `[vllm]` here dragged in xgrammar==0.2.4 which has no
# cp312 x86_64 wheel → uninstallable on this py3.12 host (#84). Client-only = `mineru[core]`.
# torchvision is pinned (a mineru transitive, not a core dep): it must match the installed
# torch's ABI — a drift to an incompatible torchvision (0.28 vs torch 2.11) crashes the shared
# torch stack, which is what broke BGE-M3 embedding for the whole service (#84).
mineru = ["mineru[core]>=3.2", "torchvision==0.26.0"]
# Zotero metadata sync (optional integration).
zotero = ["pyzotero>=1.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.3",
    "responses>=0.25",
    "ruff>=0.6",
]

[tool.uv]
# The deploy host is Linux x86_64 with an NVIDIA GPU. Force the resolver to only pick
# distributions that ship a wheel for this platform — otherwise a transitive (e.g. the
# vllm->xgrammar chain) can lock to a version with aarch64/macOS wheels only and become
# uninstallable here (#84). uv's own resolver hint recommends this.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[project.scripts]
papervault = "papervault.cli:main"
papervault-mcp = "papervault.mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/papervault"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires GPU / Postgres / Neo4j / network / a live LLM (excluded from CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Start conservative: real errors, not style bikeshedding. The migrated corpus
# carries its own idioms; broaden this over time, not on day one.
select = ["E9", "F63", "F7", "F82", "F401", "F811"]
ignore = ["E501"]
