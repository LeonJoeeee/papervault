# papervault backing stores: Postgres (pgvector) + Neo4j.
# The GPU services (embed/rerank in-process, MinerU OCR) run on the host, not here.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Credentials come from your .env (same file papervault reads). Defaults are
# dev-only — set POSTGRES_PASSWORD / NEO4J_PASSWORD for anything real.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: papervault-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-papervault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-papervault}
    volumes:
      - papervault-pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papervault} -d ${POSTGRES_DB:-papervault}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: papervault-neo4j
    environment:
      # NEO4J_AUTH is neo4j/<password>; keep it in sync with NEO4J_PASSWORD in .env.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 4G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 4G
      NEO4J_db_tx__log_rotation_retention__policy: "2 days"
    volumes:
      - papervault-neo4jdata:/data
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  papervault-pgdata:
    name: papervault-pgdata
  papervault-neo4jdata:
    name: papervault-neo4jdata
